<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Vercel's serverless runtime ships no fonts, so sharp/librsvg renders every
  <text> element as tofu boxes. This config points fontconfig at the DejaVu
  files bundled beside it. FONTCONFIG_PATH must point at this directory.
-->
<fontconfig>
  <dir prefix="default"></dir>
  <dir>/var/task/assets/fonts</dir>
  <dir>./assets/fonts</dir>
  <cachedir prefix="default">fontconfig</cachedir>
  <cachedir>/tmp/fontconfig</cachedir>

  <match target="pattern">
    <test qual="any" name="family"><string>Helvetica</string></test>
    <edit name="family" mode="assign" binding="same"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Arial</string></test>
    <edit name="family" mode="assign" binding="same"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="assign" binding="same"><string>DejaVu Sans</string></edit>
  </match>

  <alias>
    <family>sans-serif</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
</fontconfig>
